name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    env:
      # Pin Python rather than using the runner's system interpreter, which
      # changes under us (ubuntu-latest moved to 3.14 in Nov 2026). 3.12
      # matches requires-python and the repo's sync/deploy workflows.
      UV_PYTHON: "3.12"
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3 (v3.2.4), uv 0.11.14
        with:
          version: "0.11.14"
          enable-cache: "true"
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v

      - name: Step summary
        if: always()
        run: |
          echo "## Test results" >> $GITHUB_STEP_SUMMARY
          uv run pytest --tb=short -q >> $GITHUB_STEP_SUMMARY 2>&1 || true