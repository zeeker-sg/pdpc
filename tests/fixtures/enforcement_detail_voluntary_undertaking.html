<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>trimmed fixture</title></head><body><script>self.__next_f.push([1,"\n32:[\"$\",\"h1\",null,{\"children\":\"Voluntary Undertaking by DCS Card Centre Pte Ltd\"}]\n33:[\"$\",\"span\",null,{\"className\":\"page-banner__date\",\"children\":[\"Published on \",\"26 Oct 2026\"]}]\n38:T1060,<h3>Background</h3>\n<p>DCS Card Centre Pte Ltd (the &ldquo;Organisation&rdquo;) notified the Personal Data Protection Commission (the &ldquo;Commission&rdquo;) on 20 February 2026 of a personal data breach involving its Credit Card Management System (the &ldquo;Incident&rdquo;). The Organisation is a non-bank financial institution which issues credit and charge cards.</p>\n<p>The Organisation&rsquo;s Credit Card Management System (the &ldquo;System&rdquo;) was hosted in a virtual private cloud environment. The Organisation established that unknown threat actor(s) (&ldquo;TA&rdquo;) had accessed the System on 19 February 2026, by exploiting internal Application Programming Interface (&ldquo;API&rdquo;) endpoints which were publicly accessible over the Internet at the time of the Incident. The API endpoints were supposed to be accessible only within a trusted internal network for internal service communications and were not intended to be exposed to the public Internet. The API endpoints became publicly exposed after IP whitelisting, a perimeter access control, was removed by the Organisation in December 2025 to accommodate operating a third-party solution. After gaining access, the TA exfiltrated personal data from the System. The Organisation&rsquo;s IT team discovered the Incident on the same day.</p>\n<p>The data breach affected 22,076 individuals and the types of personal data affected included a combination of names, residential address, personal email address, passport and other national identification document numbers, mobile phone number, date of birth, nationality, with a smaller number of income information and full credit card numbers (without CVV). There was no evidence of public exposure or misuse of the affected personal data.</p>\n<p>Upon discovery of the Incident, the Organisation took prompt remedial actions including implementing Web Application Firewall (&ldquo;WAF&rdquo;) blacklisting rules, encrypting data at rest, enforcing digital signing of inter-service data requests and implementing multi-factor authentication for end-user operations. The Organisation also notified the affected customers, provided credit card replacements and support channels.</p>\n<p>The Incident had likely occurred because the Organisation did not have sufficient security measures prior to the Incident, including not configuring its WAF rules to cover the internal API endpoints resulting in a gap, and relying on a single point of defence (IP whitelisting) as its primary security control without performing a risk assessment and implementing other security measures after its removal. The Organisation did, however, had other protective measures in place, including multi-factor authentication for database administrator access and solutions for device-level access control.</p>\n<h3>Voluntary Undertaking</h3>\n<p>Having considered the circumstances of the case, the Commission accepted a voluntary undertaking (the &ldquo;Undertaking&rdquo;) from the Organisation to improve its compliance with the Personal Data Protection Act 2012. The Undertaking was executed on 31 August 2026.</p>\n<p>As part of the Undertaking, the Organisation has or will be implementing the following including:</p>\n<p style=\"margin-left: 40px;\">a. Enforcing explicit deny-by-default ingress policies including denying all inbound traffic by default;</p>\n<p style=\"margin-left: 40px;\">b. Implementing whitelisting as the primary control on APIs with WAF blacklisting as a supplementary control;</p>\n<p style=\"margin-left: 40px;\">c. Conducting penetration testing with an independent external third-party;</p>\n<p style=\"margin-left: 40px;\">d. Enforcing robust object-level authorisation controls;</p>\n<p style=\"margin-left: 40px;\">e. Logging coverage for all production buckets; and</p>\n<p style=\"margin-left: 40px;\">f. Full Virtual Private Cloud (VPC) architectural segregation with inter-service authentication.</p>\n<p>The Commission will verify the Organisation&rsquo;s compliance with the Undertaking. If the Organisation fails to comply with any terms of the Undertaking, the Commission may issue a direction to ensure the Organisation&rsquo;s compliance with the Undertaking.</p>35:[\"$\",\"main\",null,{\"className\":\"layout layout--standard\",\"children\":[[\"$\",\"article\",null,{\"className\":\"container container--narrow\",\"children\":[\"$undefined\",\"$undefined\",\"$undefined\",[\"$\",\"$L37\",null,{\"data\":{\"content\":\"$38\"}}],[],\"$L39\"]}],\"$undefined\",false]}]\n36:[\"$\",\"footer\",null,{\"className\":\"site-footer\",\"children\":[[\"$\",\"$L3b\",null,{\"data\":{\"date_created\":\"2025-12-02T06:58:01.000Z\",\"date_updated\":\"2026-05-22T10:28:16.020Z\",\"content\":\"<p>To offer you a better experience, this site uses cookies. Read more about cookies in our <a style=\\\"color: #865991; text-decoration: underline;\\\" href=\\\"/privacy-statement\\\">Privacy Statement</a>.</p>\"}}],[\"$\",\"div\",null,{\"className\":\"container\",\"children\":[[\"$\",\"header\",null,{\"className\":\"site-footer__header\",\"children\":[\"$\",\"h2\",null,{\"children\":\"Personal Data Protection Commission\"}]}],[\"$\",\"div\",null,{\"className\":\"site-footer__body\",\"children\":[[\"$\",\"nav\",null,{\"className\":\"site-footer__nav\",\"aria-label\":\"Footer site navigation\",\"children\":[\"$\",\"ul\",null,{\"children\":[[\"$\",\"li\",\"About\",{\"children\":[\"$\",\"a\",null,{\"target\":\"_self\",\"href\":\"/about\",\"children\":\"About\"}]}],[\"$\",\"li\",\"Organisations\",{\"children\":[\"$\",\"a\",null,{\"target\":\"_self\",\"href\":\"/organisations\",\"children\":\"Organisations\"
