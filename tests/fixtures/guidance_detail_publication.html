<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>trimmed fixture</title></head><body><script>self.__next_f.push([1,"\n32:[\"$\",\"h1\",null,{\"children\":\"Guide on Federated Learning\"}]\n33:[\"$\",\"span\",null,{\"className\":\"page-banner__date\",\"children\":[\"Published on \",\"20 Jul 2026\"]}]\n35:[\"$\",\"main\",null,{\"className\":\"layout layout--standard\",\"children\":[[\"$\",\"article\",null,{\"className\":\"container container--narrow\",\"children\":[\"$undefined\",\"$undefined\",\"$undefined\",[\"$\",\"$L37\",null,{\"data\":{\"content\":\"<p>Federated Learning (FL) has emerged as a promising Privacy Enhancing Technology (PET) that enables AI model training across multiple data sources without requiring organisations to share or centralise their underlying data. By keeping input data local and sharing only model updates, FL allows organisations to collaborate securely, unlock the value of diverse datasets, and produce better AI models.</p>\\n<p>This guide is intended to help organisations understand FL techniques and use cases, and navigate the practical considerations for exploring and implementing FL. It recommends an Adoption Roadmap covering suitability and readiness assessments as well as key design considerations. The guide is offered as a resource within the Privacy Enhancing Technology Sandbox, which provides a safe environment for organisations to explore FL on pilot use cases and gain regulatory clarity.</p>\"}}],[[\"$\",\"$L38\",\"762\",{\"data\":{\"description\":\"Understand FL techniques, use cases and navigate the practical considerations \",\"id\":762,\"name\":\"Guide on Federated Learning\",\"title\":\"Guide on Federated Learning\",\"image\":null,\"cta\":{\"type\":\"external\",\"url\":\"/assets/bb55b0bd-7367-487d-980b-4701274bca7b\",\"label\":\"Access Guide\",\"target\":\"_self\",\"internal_page\":[]},\"variant\":\"banner\"},\"isCollateral\":false,\"isVertical\":false}],[\"$\",\"$L37\",\"2756\",{\"data\":{\"content\":\"<
