<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>trimmed fixture</title></head><body><script>self.__next_f.push([1,"\n32:[\"$\",\"h1\",null,{\"children\":\"e-Learning Programme for Every Employee\"}]\n33:[\"$\",\"span\",null,{\"className\":\"page-banner__date\",\"children\":[\"Published on \",\"01 Sep 2026\"]}]\n39:T4cc,<h2 id=\"Overview\" data-anchor=\"Overview\">Overview</h2>\n<p>Protecting personal data is everyone's job, not the Data Protection Officer's (DPO's) alone. The DPO leads the organisation's efforts, but every employee that handles personal data shares the responsibility. This programme provides a working understanding of the PDPA to all employees in every organisation <span class=\"notion-enable-hover\" data-token-index=\"0\" data-notion-highlight=\"default\">&mdash; starting with the basics, then covering how it applies to specific roles and functions at work.</span><!-- notionvc: 4966cc78-d28c-49b8-a149-10e727a7d846 --></p>\n<p><span class=\"notion-enable-hover\" data-token-index=\"0\" data-notion-highlight=\"default\">The programme is split into two short series:<br></span></p>\n<ul>\n<li><span class=\"notion-enable-hover\" data-token-index=\"0\" data-notion-highlight=\"default\"><strong>Series 1: PDPA Foundation Series</strong> &mdash; the essentials every employee needs, to be watched in order.</span></li>\n<li><span class=\"notion-enable-hover\" data-token-index=\"0\" data-notion-highlight=\"default\"><strong>Series 2: Data Protection in Practice</strong> &mdash; how the PDPA applies in role-specific functions at work.</span></li>\n</ul>3b:T524,<p><strong><span class=\"notion-enable-hover\" data-token-index=\"0\">Resources:</span></strong></p>\n<a style=\"display: flex; align-items: center; text-decoration: none; margin-left: 20px;\" href=\"https://www.pdpc.gov.sg/organisations/regulations-decisions/regulatory-guidance/advisory-guidelines-on-key-concepts-in-the-personal-data-protection-act\">Advisory Guidelines on Key Concepts in the PDPA\n<div class=\"icon icon-arrow-right\" style=\"display: inline-block;\">&nbsp;</div>\n</a>\n<h3>&nbsp;</h3>\n<h3>Section 2:&nbsp;<span class=\"notion-enable-hover\" data-token-index=\"0\">Learn Everyday Habits to Keep Personal Data Safe At Work</span><!-- notionvc: b62161f4-da46-4a7f-a228-68eaafb5c492 --></h3>\n<p><em><span class=\"notion-enable-hover\" data-token-index=\"0\">Practical &middot; about 4 minutes &middot; Protection Obligation</span></em><!-- notionvc: 3677320f-3631-4359-b70f-6e39e6fd1b7f --></p>\n<p><span class=\"notion-enable-hover\" data-token-index=\"0\">Learn s<span class=\"notion-enable-hover\" data-token-index=\"0\" data-notion-highlight=\"default\">imple administrative, physical, and technical habits that keep personal data safe, and why that responsibility belongs to everyone. Adopt these habits, and access only the data you need for your job. </span><!-- notionvc: 0be4c375-c3ed-40e1-b15b-b4e66b4579f2 --></span></p>35:[\"$\",\"main\",null,{\"className\":\"layout layout--standard\",\"children\":[[\"$\",\"div\",null,{\"className\":\"container\",\"children\":[\"$\",\"div\",null,{\"className\":\"row\",\"children\":[[\"$\",\"$L37\",null,{\"sideNavItems\":[{\"title\":\"Overview\",\"targetId\":\"Overview\"},{\"title\":\"Series 1: Playlist\",\"targetId\":\"Series 1: Playlist\"},{\"title\":\"Series 1: Assessment\",\"targetId\":\"Series 1: Assessment\"},{\"title\":\"Series 2: Playlist and Assessments\",\"targetId\":\"Series 2: Playlist and Assessments\"},{\"title\":\"For DPOs: Completion Tracker\",\"targetId\":\"For DPOs: Completion Tracker\"},{\"title\":\"FAQs\",\"targetId\":\"FAQs\"}]}],[\"$\",\"main\",null,{\"className\":\"col-lg-9\",\"children\":[\"$\",\"article\",null,{\"className\":\"layout layout--standard\",\"children\":[\"$undefined\",\"$undefined\",[\"$\",\"$L38\",null,{\"data\":{\"content\":\"$39\"}}],[[\"$\",\"$L38\",\"4381\",{\"data\":{\"content\":\"<h2 id=\\\"Series-1\\\" data-anchor=\\\"Series 1: Playlist\\\">Series 1: PDPA Foundation for Every Employee</h2>\\n<p>Watch Sections 1 to 6 in order. Together, they explain the PDPA, show the safe way to handle personal data day-to-day, and cover what to do when something goes wrong.</p>\\n<h3>Section 1: What is Personal Data &amp; How Does It Apply To You?</h3>\\n<p><em><span class=\\\"notion-enable-hover\\\" data-token-index=\\\"0\\\">Awareness &middot; about 5.5 minutes</span></em><!-- notionvc: 14b6a5a5-1f6d-4865-b101-4b898caf2092 --></p>\\n<p><span class=\\\"notion-enable-hover\\\" data-token-index=\\\"0\\\">Learn what is the PDPA, who it applies to, and how to recognise what is personal data.&nbsp;</span></p>\",\"id\":4381,\"name\":\"S1, S1\"}}],[\"$\",\"$L3a\",\"603\",{\"data\":{\"id\":603,\"name\":\"S1, S1 Video\",\"video_id\":\"LDAzv9NElr8\",\"image\":{\"filename_disk\":\"6a1313fe-b05c-453a-9ce7-7ebd01852b67.png\",\"description\":null}}}],[\"$\",\"$L38\",\"4382\",{\"data\":{\"content\":\"$3b\",\"id\":4382,\"name\":\"S1, S1 Resources & S1, S2\"}}],\"$L3c\",\"$L3d\",\"$L3e\",\"$L3f\",\"$L40\",\"$L41\",\"$L42\",\"$L43\",\"$L44\",\"$L45\",\"$L46\",\"$L47\",\"$L48\",\"$L49\",\"$L4a\",\"$L4b\",\"$L4c\",\"$L4d\",\"$L4e\",\"$L4f\",\"$L50\",\"$L51\",\"$L52\",\"$L53\",\"$L54\"],\"$L55\"]}]}]]}]}],\"$undefined\",false]}]\n56:T6bb,<p><strong><span class=\"notion-enable-hover\" data-token-index=\"0\">Resources:</span></strong></p>\n<a style=\"display: flex; align-items: center; text-decoration: none; margin-left: 20px;\" href=\"https://www.pdpc.gov.sg/organisations/resources/guidance-by-topic/data-protection-essentials\">Data Protection Essentials (DPE)\n<div class=\"icon icon-arrow-right\" style=\"display: inline-block;\">&nbsp;</div>\n</a><a style=\"display: flex; align-items: center; text-decoration: none; margin-left: 20px;\" href=\"https://www.pdpc.gov.sg/organisations/resources/guidance-by-topic/guide-to-data-protection-practices-for-ict-systems\">Guide to Data Protection Practices for ICT Systems\n<div class=\"icon icon-arrow-right\" style=\"display: inline-block;\">&nbsp;</div>\n</a>\n<h3>&nbsp;</h3>\n<h3>Section 3: <span data-token-index=\"0\">How To Get Consent &amp; What Can You Do With The Data?</span><!-- notionvc: 825ca966-19e9-4c09-bd6d-564b9e4fbc1c --><!-- notionvc: b62161f4-da46-4a7f-a228-68eaafb5c492 --></h3>\n<p><em><span class=\"notion-enable-hover\" data-token-index=\"0\">Practical &middot; about 5.5 minutes &middot; Consent, Notification, and Purpose Limitation</span></em><!-- notionvc: 7d228291-d92a-439c-b890-c5ccfea9f173 --><br><!-- notionvc: 3677320f-3631-4359-b70f-6e39e6fd1b7f --></p>\n<p><span class=\"notion-enable-hover\" data-token-index=\"0\"><span class=\"notion-enable-hover\" data-token-index=\"0\" data-notion-highlight=\"default\">Understand what valid consent looks like, your duty to tell people why you&rsquo;re collecting their data, and the rule that you can only use it for the purpose you gave.&nbsp;</span><!-- notionvc: 5ec4389c-18d9-4fd2-ad85-9e2be76555ed --><br><!-- notionvc: 0be4c375-c3ed-40e1-b15b-b4e66b4579f2 --></span></p>3d:[\"$\",\"$L38\",\"4383\",{\"data\":{\"content\":\"$56\",\"id\":4383,\"name\":\"S1, S2 Resources & S1, S3\"}}]\n57:T4ad,<p><strong><span class=\"notion-enable-hover\" data-token-index=\"0\">Resources:</span></strong></p>\n<a style=\"display: flex; align-items: center; text-decoration: none; margin-left: 20px;\" href=\"https://www.pdpc.gov.sg/organisations/resources/guidance-by-topic/guide-to-notification\">Guide to Notification\n<div class=\"icon icon-arrow-right\" style=\"display: inline-block;\">&nbsp;</div>\n</a>\n<h3>&nbsp;</h3>\n<h3>Section 4: <span data-token-index=\"0\">What Should You Do When a Data Breach Happens?</span><!-- notionvc: 825ca966-19e9-4c09-bd6d-564b9e4fbc1c --><!-- notionvc: b62161f4-da46-4a7f-a228-68eaafb5c492 --></h3>\n<p><em><span class=\"notion-enable-hover\" data-token-index=\"0\">Practical &middot; about 5.5 minutes &middot; Data Breach Notification</span></em><!-- notionvc: d82a5c80-cd44-484b-b01e-d9c27294d804 --><br><!-- notionvc: 3677320f-3631-4359-b70f-6e39e6fd1b7f --></p>\n<p><span class=\"notion-enable-hover\" data-token-index=\"0\">Learn how to recognise a data breach and respond using the C.A.R.E. steps &mdash; Contain, Assess, Report, and Evaluate. Act quickly, in the right order, and inform your DPO immediately.&nbsp;<br><!-- notionvc: 0be4c375-c3ed-40e1-b15b-b4e66b4579f2 --></span></p>3f:[\"$\",\"$L38\",\"4384\",{\"data\":{\"content\":\"$57\",\"id\":4384,\"name\":\"S1, S3 Resources & S1, S4\"}}]\n58:T6ac,<p><strong><span class=\"notion-enable-hover\" data-token-index=\"0\">Resources:</span></strong></p>\n<a style=\"display: flex; align-items: center; text-decoration: none; margin-left: 20px;\" href=\"https://www.pdpc.gov.sg/organisations/resources/guidance-by-topic/data-breach-management-guide\">Guide on Managing and Notifying Data Breaches\n<div class=\"icon icon-arrow-right\" style=\"display: inline-block;\">&nbsp;</div>\n</a><a style=\"display: flex; align-items: center; text-decoration: none; margin-left: 20px;\" href=\"https://www.pdpc.gov.sg/organisations/e-services/report-your-organisations-data-breach\">Report Your Organisation's Data Breach\n<div class=\"icon icon-arrow-right\" style=\"display: inline-block;\">&nbsp;</div>\n</a>\n<h3>&nbsp;</h3>\n<h3>Section 5: <span data-token-index=\"0\">Who Is Responsible When Things Go Wrong?</span><!-- notionvc: 825ca966-19e9-4c09-bd6d-564b9e4fbc1c --><!-- notionvc: b62161f4-da46-4a7f-a228-68eaafb5c492 --></h3>\n<p><em><span class=\"notion-enable-hover\" data-token-index=\"0\">Awareness &middot; about 6 minutes &middot; Accountability Obligation</span></em><!-- notionvc: e08648d8-12d5-41b4-90c3-2688687e4a35 --><br><!-- notionvc: 3677320f-3631-4359-b70f-6e39e6fd1b7f --></p>\n<p><span class=\"notion-enable-hover\" data-token-index=\"0\"><span class=\"notion-enable-hover\" data-token-index=\"0\" data-notion-highlight=\"default\">Understand what every organisation must put in place to protect personal data, and where responsibility sits when something goes wrong. Every organisation must appoint a DPO and be ready to show how it protects personal data.</span><!-- notionvc: d395c217-0b93-4ad3-9b12-276fa4ed7387 --><br><!-- notionvc: 0be4c375-c3ed-40e1-b15b-b4e66b4579f2 --></span></p>41:[\"$\",\"$L38\",\"4385\",{\"data\":{\"content\":\"$58\",\"id\":4385,\"name\":\"S1, S4 Resources & S1,S5\"}}]\n59:T683,<p><strong><span class=\"notion-enable-hover\" data-token-index=\"0\">Resources:</span></strong></p>\n<a style=\"display: flex; align-items: center; text-decoration: none; margin-left: 20px;\" href=\"https://form.gov.sg/69b3d9792f8a465a723047b9\">Register your DPO with the PDPC\n<div class=\"icon icon-arrow-right\" style=\"display: inline-block;\">&nbsp;</div>\n</a><a style=\"display: flex; align-items: center; text-decoration: none; margin-left: 20px;\" href=\"https://www.pdpc.gov.sg/organisations/resources/guidance-by-topic/guide-to-developing-a-data-protection-management-programme\">Guide to Data Protection Management Programme\n<div class=\"icon icon-arrow-right\" style=\"display: inline-block;\">&nbsp;</div>\n</a>\n<h3>&nbsp;</h3>\n<h3>Section 6: <span data-token-index=\"0\">What Does A Data Protection Officer (DPO) Do?</span><!-- notionvc: 825ca966-19e9-4c09-bd6d-564b9e4fbc1c --><!-- notionvc: b62161f4-da46-4a7f-a228-68eaafb5c492 --></h3>\n<p><em><span class=\"notion-enable-hover\" data-token-index=\"0\">Practical &middot; about 6 minutes &middot; Accountability Obligation</span></em><!-- notionvc: 2e391adf-fa33-4347-94a6-616ba6da3b0a --><br><!-- notionvc: 3677320f-3631-4359-b70f-6e39e6fd1b7f --></p>\n<p><span class=\"notion-enable-hover\" data-token-index=\"0\"><span class=\"notion-enable-hover\" data-token-index=\"0\" data-notion-highlight=\"default\">Your DPO is who you go to when something involving personal data doesn't look right. This video walks you through what your DPO is responsible for, and what happens after you flag a concern to them.</span><!-- notionvc: 56512f0e-fc9d-483b-9fe4-e4015c655511 --><br><!-- notionvc: 0be4c375-c3ed-40e1-b15b-b4e66b4579f2 --></span></p>43:[\"$\",\"$L38\",\"4386\",{\"data\":{\"content\":\"$59\",\"id\":4386,\"name\":\"S1, S5 Resources & S1, S6\"}}]\n5a:T5b3,<h2 id=\"Series 1: Assessment\" data-anchor=\"Series 1: Assessment\">Series 1: Assessment</h2>\n<p><span class=\"notion-enable-hover\" data-token-index=\"0\"><span class=\"notion-enable-hover\" data-token-index=\"0\" data-notion-highlight=\"default\">Once you have watches Series 1, take this assessment to test what you have learnt.&nbsp;</span><br><!-- notionvc: 0be4c375-c3ed-40e1-b15b-b4e66b4579f2 --></span></p>\n<ul>\n<li><span class=\"notion-enable-hover\" data-token-index=\"0\"><span class=\"notion-enable-hover\" data-token-index=\"0\" data-notion-highlight=\"default\"><strong>Multiple-choice questions</strong>, based on Series 1.</span></span></li>\n<li><span class=\"notion-enable-hover\" data-token-index=\"0\"><span class=\"notion-enable-hover\" data-token-index=\"0\" data-notion-highlight=\"default\"><strong>Up to 30 minutes</strong> to complete.</span></span></li>\n<li><span class=\"notion-enable-hover\" data-token-index=\"0\"><span class=\"notion-enable-hover\" data-token-index=\"0\" data-notion-highlight=\"default\"><strong>No account of login needed</strong>, just your email which your results will be sent to.</span></span></li>\n</ul>\n<p><span class=\"notion-enable-hover\" data-token-index=\"0\"><span class=\"notion-enable-hover\" data-token-index=\"0\" data-notion-highlight=\"default\">There's no prescribed passing score. If you are completing this as part of your organisation's training requirements, please check with your DPO on any criteria they have set.&nbsp;</span></span></p>45:[\"$\",\"$L38\",\"4387\",{\"data\":{\"content\":\"$5a\",\"id\":4387,\"name\":\"S1 Assessment\"}}]\n46:[\"$\",\"$L5b\",\"1326\",{\"data\":{\"description\":\"Watch Series 1 first, then take this assessment. Your results will be emailed to you. \",\"id\":1326,\"name\":\"S1 Assessment CTA\",\"title\":\"Ready to test what you've learnt in Series 1?\",\"image\":null,\"cta\":{\"type\":\"external\",\"url\":\"https://go.gov.sg/assessment-pdpaobligations\",\"label\":\"Take Assessment\",\"target\":\"_blank\",\"internal_page\":[]},\"variant\":\"banner\"},\"isCollateral\":false,\"isVertical\":false}]\n47:[\"$\",\"$L38\",\"5172\",{\"data\":{\"content\":\"<h2 id=\\\"Series-2\\\" data-anchor=\\\"Series 2: Playlist and Assessments\\\">Series 2: Data Protection in Practice (Sections 7 to 11)</h2>\\n<p>The following five sections build on Series 1, looking at how the PDPA applies to a role that handles more personal data daily. After completing Series 1, watch the Series 2 section(s) applicable to your role at work.</p>\\n<p>Each section closes with its own short assessment, consisting of 6 questions.</p>\\n<h3>Section 7: Sales &amp; Marketing &ndash; Get Marketing Consent Right</h3>\\n<p><em><span class=\\\"notion-enable-hover\\\" data-token-index=\\\"0\\\">Application &middot; about 6 minutes &middot; Consent, Do Not Call (DNC), and Purpose Limitation</span></em></p>\\n<p><span class=\\\"notion-enable-hover\\\" data-token-index=\\\"0\\\">Learn the three checks every marketing campaign needs: valid opt-in consent, a DNC Registry check, and using data only for the purpose the customer was informed about.</span></p>\",\"id\":5172,\"name\":\"S2, S7\"}}]\n5c:T566,<p><strong><span class=\"notion-enable-hover\" data-token-index=\"0\">Resources:</span></strong></p>\n<a style=\"display: flex; align-items: center; text-decoration: none; margin-left: 20px;\" href=\"https://www.dnc.gov.sg/index.html\">Check the DNC Registry before you do telemarketing\n<div class=\"icon icon-arrow-right\" style=\"display: inline-block;\">&nbsp;</div>\n</a>\n<p>&nbsp;</p>\n<p><a class=\"cta-button\" style=\"color: var(--color-primary-50);\" href=\"https://go.gov.sg/assessment-marketing\" target=\"_self\" aria-label=\"Take the assessment\"><span class=\"label\">Take the assessment</span><span class=\"icon icon-arrow-right\"></span></a></p>\n<h3>&nbsp;</h3>\n<h3>Section 8:&nbsp;<span class=\"notion-enable-hover\" data-token-index=\"0\">Human Resources &ndash; Handle Employee Data Responsibly</span><!-- notionvc: b62161f4-da46-4a7f-a228-68eaafb5c492 --></h3>\n<p><em><span class=\"notion-enable-hover\" data-token-index=\"0\">Application &middot; about 6 minutes &middot; Consent, Access and Correction, and Retention Limitation</span></em><!-- notionvc: 3677320f-3631-4359-b70f-6e39e6fd1b7f --></p>\n<p><span class=\"notion-enable-hover\" data-token-index=\"0\">Learn what personal data you can collect at each stage of employment, how to handle access and correction requests, and how to retain and dispose of HR records appropriately.</span><!-- notionvc: 0be4c375-c3ed-40e1-b15b-b4e66b4579f2 --></p>49:[\"$\",\"$L38\",\"5173\",{\"data\":{\"content\":\"$5c\",\"id\":5173,\"name\":\"S2, S7 Resources & S2, S8\"}}]\n5d:T5ff,<p><strong><span class=\"notion-enable-hover\" data-token-index=\"0\">Resources:</span></strong></p>\n<a style=\"display: flex; align-items: center; text-decoration: none; margin-left: 20px;\" href=\"https://www.pdpc.gov.sg/organisations/regulations-decisions/regulatory-guidance/advisory-guidelines-on-the-personal-data-protection-act-for-selected-topics\">Advisory Guidelines on the PDPA for Selected Topics\n<div class=\"icon icon-arrow-right\" style=\"display: inline-block;\">&nbsp;</div>\n</a>\n<p>&nbsp;</p>\n<p><a class=\"cta-button\" style=\"color: var(--color-primary-50);\" href=\"https://go.gov.sg/assessment-hr\" target=\"_self\" aria-label=\"Take the assessment\"><span class=\"label\">Take the assessment</span><span class=\"icon icon-arrow-right\"></span></a></p>\n<h3>&nbsp;</h3>\n<h3>Section 9:&nbsp;<span class=\"notion-enable-hover\" data-token-index=\"0\">Vendor Management &ndash; Manage Personal Data with Vendors</span><!-- notionvc: b62161f4-da46-4a7f-a228-68eaafb5c492 --></h3>\n<p><em><span class=\"notion-enable-hover\" data-token-index=\"0\">Application &middot; about 7 minutes &middot; Protection, Transfer Limitation, and Data Breach Notification</span></em><!-- notionvc: 3677320f-3631-4359-b70f-6e39e6fd1b7f --></p>\n<p><span class=\"notion-enable-hover\" data-token-index=\"0\">Understand what to put in vendor contracts, how to manage overseas transfers, and what to do when a vendor reports a data breach. Your organisation stays responsible, even when a vendor handles the data.</span><!-- notionvc: 0be4c375-c3ed-40e1-b15b-b4e66b4579f2 --></p>4b:[\"$\",\"$L38\",\"5174\",{\"data\":{\"content\":\"$5d\",\"id\":5174,\"name\":\"S2, S8 Resources & S2, S9\"}}]\n5e:T573,<p><strong><span class=\"notion-enable-hover\" data-token-index=\"0\">Resources:</span></strong></p>\n<a style=\"display: flex; align-items: center; text-decoration: none; margin-left: 20px;\" href=\"https://www.pdpc.gov.sg/organisations/resources/guidance-by-topic/guide-to-cross-border-data-transfers\">Guide to Cross-Border Data Transfers\n<div class=\"icon icon-arrow-right\" style=\"display: inline-block;\">&nbsp;</div>\n</a>\n<p>&nbsp;</p>\n<p><a class=\"cta-button\" style=\"color: var(--color-primary-50);\" href=\"https://go.gov.sg/assessment-vendormanagement\" target=\"_self\" aria-label=\"Take the assessment\"><span class=\"label\">Take the assessment</span><span class=\"icon icon-arrow-right\"></span></a></p>\n<h3>&nbsp;</h3>\n<h3>Section 10:&nbsp;<span class=\"notion-enable-hover\" data-token-index=\"0\">Finance &ndash; Protect Financial Data at Every Stage</span><!-- notionvc: b62161f4-da46-4a7f-a228-68eaafb5c492 --></h3>\n<p><em><span class=\"notion-enable-hover\" data-token-index=\"0\">Application &middot; about 7 minutes &middot; Protection, Retention Limitation, and Data Breach Notification</span></em><!-- notionvc: 3677320f-3631-4359-b70f-6e39e6fd1b7f --></p>\n<p><span class=\"notion-enable-hover\" data-token-index=\"0\">Learn how to keep financial data secure, retain and dispose of records properly, and respond the moment a breach happens.</span><!-- notionvc: 0be4c375-c3ed-40e1-b15b-b4e66b4579f2 --></p>4d:[\"$\",\"$L38\",\"5175\",{\"data\":{\"content\":\"$5e\",\"id\":5175,\"name\":\"S2, S9 Resources & S2, S10\"}}]\n5f:T521,<p><strong><span class=\"notion-enable-hover\" data-token-index=\"0\">Resources:</span></strong></p>\n<a style=\"display: flex; align-items: center; text-decoration: none; margin-left: 20px;\" href=\"https://www.pdpc.gov.sg/organisations/resources/guidance-by-topic/guide-to-data-protection-practices-for-ict-systems\">Guide to Data Protection Practices for ICT Systems\n<div class=\"icon icon-arrow-right\" style=\"display: inline-block;\">&nbsp;</div>\n</a>\n<p>&nbsp;</p>\n<p><a class=\"cta-button\" style=\"color: var(--color-primary-50);\" href=\"https://go.gov.sg/assessment-finance\" target=\"_self\" aria-label=\"Take the assessment\"><span class=\"label\">Take the assessment</span><span class=\"icon icon-arrow-right\"></span></a></p>\n<h3>&nbsp;</h3>\n<h3>Section 11:&nbsp;<span class=\"notion-enable-hover\" data-token-index=\"0\">Customer Service &ndash; Handle Customer Data Requests Properly</span><!-- notionvc: b62161f4-da46-4a7f-a228-68eaafb5c492 --></h3>\n<p><em><span class=\"notion-enable-hover\" data-token-index=\"0\">Application &middot; about 7 minutes &middot; Access and Correction, Withdrawal of Consent, and DNC</span></em><!-- notionvc: 3677320f-3631-4359-b70f-6e39e6fd1b7f --></p>\n<p>Learn how to verify identity, log and route data requests, respond within the required timelines, and know when to escalate to your DPO.</p>4f:[\"$\",\"$L38\",\"5176\",{\"data\":{\"content\":\"$5f\",\"id\":5176,\"name\":\"S2, S10 Resources & S2, S11\"}}]\n60:T4e0,<p><strong><span class=\"notion-enable-hover\" data-token-index=\"0\">Resources:</span></strong></p>\n<a style=\"display: flex; align-items: center; text-decoration: none; margin-left: 20px;\" href=\"https://www.pdpc.gov.sg/organisations/resources/guidance-by-topic/guide-to-handling-access-requests\">Guide to Handling Access Requests\n<div class=\"icon icon-arrow-right\" style=\"display: inline-block;\">&nbsp;</div>\n</a>\n<p>&nbsp;</p>\n<p><a class=\"cta-button\" style=\"color: var(--color-primary-50);\" href=\"https://go.gov.sg/assessment-customerservice\" target=\"_self\" aria-label=\"Take the assessment\"><span class=\"label\">Take the assessment</span></a></p>\n<h3>&nbsp;</h3>\n<h2 id=\"for-dpos\" data-anchor=\"For DPOs: Completion Tracker\">For DPOs: Tracking Your Team's Completion</h2>\n<p>You can request your organisation&rsquo;s staff assessment records for a selected date range, covering both Series 1 and 2.</p>\n<p>Submit the request form using your organisation&rsquo;s registered DPO email address. We will send a one-time verification code to this address. The records will be emailed to you upon successful verification.</p>\n<p><em>Note: Your organisation must have its DPO registered with PDPC in order to use this service.<strong>&nbsp;</strong></em></p>51:[\"$\",\"$L38\",\"5177\",{\"data\":{\"content\":\"$60\",\"id\":5177,\"name\":\"For DPOs: Tracking Your Team's Completion\"}}]\n53:[\"$\",\"$L38\",\"5178\",{\"data\":{\"content\":\"<h3 id=\\\"FAQs\\\" data-anchor=\\\"FAQs\\\">Frequently Asked Questions</h3>\\n<p>&nbsp;</p>\",\"id\":5178,\"name\":\"FAQs nav button\"}}]\n36:[\"$\",\"footer\",null,{\"className\":\"site-footer\",\"children\":[[\"$\",\"$L64\",null,{\"data\":{\"date_created\":\"2025-12-02T06:58:01.000Z\",\"date_updated\":\"2026-05-22T10:28:16.020Z\",\"content\":\"<p>To offer you a better experience, this site uses cookies. Read more about cookies in our <a style=\\\"color: #865991; text-decoration: underline;\\\" href=\\\"/privacy-statement\\\">Privacy Statement</a>.</p>\"}}],[\"$\",\"div\",null,{\"className\":\"container\",\"children\":[[\"$\",\"header\",null,{\"className\":\"site-footer__header\",\"children\":[\"$\",\"h2\",null,{\"children\":\"Personal Data Protection Commission\"}]}],[\"$\",\"div\",null,{\"className\":\"site-f
